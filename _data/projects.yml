# The author's other projects, in display order.
# Every placement on the site reads from here: the "Go further" cards on the home
# page, the author box under each article, the About page and the footer.
# To add a project, add an entry with the same fields, with "id" first (the site
# check counts entries by it). Text fields have one value
# per site language (en, ro). Facts checked against each live site on 2026-11-13.
# "help" is the line shown on the mentorship page. "schema_type", "schema_id" and
# "relation" describe the project to search engines (founder of an organisation,
# author of a book). schema_id is the id the project uses for itself in its own
# structured data, so both sites point at the same thing. Let's Talk AI does not
# declare one yet: the id below is the one to add on lets-talk-ai.ro.

- id: lets-talk-ai
  schema_type: "Organization"
  schema_id: "https://lets-talk-ai.ro/#org"
  relation: "founder"
  help:
    en: "Free and in person. A monthly AI mixer in Bucharest where people who work with AI tell you how it really goes."
    ro: "Gratuit și față în față. Un mixer lunar despre AI, la București, unde oameni care lucrează cu AI îți spun cum merge de fapt."
  name: "Let's Talk AI"
  url:
    en: "https://lets-talk-ai.ro/"
    ro: "https://lets-talk-ai.ro/ro/"
  role:
    en: "Founder and co-organizer"
    ro: "Fondator și coorganizator"
  need:
    en: "Talk about it in person"
    ro: "Vorbește despre AI față în față"
  blurb:
    en: "A free monthly AI mixer in Bucharest, on the first Wednesday of the month. People who work with AI share what worked and what they would do differently."
    ro: "Un mixer lunar gratuit despre AI, la București, în prima miercuri a lunii. Oameni care lucrează cu AI povestesc ce a mers și ce ar face altfel."
  tagline:
    en: "the free monthly AI mixer in Bucharest"
    ro: "mixerul lunar gratuit despre AI din București"
  cta:
    en: "See the next edition"
    ro: "Vezi următoarea ediție"

