# page, the author box under each article, the About page and the footer.
# To add a project, add an entry with the same fields. Text fields have one value
# per site language (en, ro). Facts checked against each live site on 2026-11-13.

- id: lets-talk-ai
  name: "Let's Talk AI"
  url:
    en: "https://lets-talk-ai.ro/"
    ro: "https://lets-talk-ai.ro/ro/"
  role:
    en: "Founder and co-organizer"
    ro: "Fondator și co-organizator"
  need:
    en: "Talk about it in person"
    ro: "Vorbește despre AI față în față"
  blurb:
    en: "A free monthly AI mixer in Bucharest, on the first Wednesday of the month. People who work with AI share what worked and what they would do differently."
    ro: "Un mixer lunar gratuit despre AI, la București, în prima miercuri a lunii. Oameni care lucrează cu AI povestesc ce a mers și ce ar face altfel."
