topics:
  - title:
      en: "AI literacy"
      ro: "AI literacy"
    text:
      en: "What every person at work needs to know to use AI well. This is what AI School teaches."
      ro: "Ce trebuie să știe orice om la locul de muncă pentru a folosi bine AI. Asta predă AI School."
  - title:
      en: "AI strategy"
      ro: "Strategie AI"
    text:
      en: "Where AI pays off in a company, in what order and at what cost."
      ro: "Unde merită AI într-o companie, în ce ordine și cu ce costuri."
  - title:
      en: "LLM, RAG and agent systems"
      ro: "Sisteme cu LLM, RAG și agenți"
    text:
      en: "How to design them, who should build them and how to keep delivery on track."
      ro: "Cum le proiectezi, cine ar trebui să le construiască și cum ții livrarea pe drumul bun."
  - title:
      en: "AI coding agents"
      ro: "Agenți AI pentru programare"
    text:
      en: "How software teams change when coding agents arrive. The subject of the manual Ship It With AI."
      ro: "Cum se schimbă echipele de software când apar agenții AI pentru programare. Subiectul manualului Ship It With AI."
  - title:
      en: "EU AI Act"
      ro: "AI Act"
    text:
      en: "AI literacy under Article 4 and an internal AI policy."
      ro: "Alfabetizare AI, conform articolului 4, și politică internă despre AI."
  - title:
      en: "Edge AI and MLOps"
      ro: "Edge AI și MLOps"
    text:
      en: "AI that holds up in production and in real infrastructure, not only in a demo."
      ro: "AI care rezistă în producție și în infrastructura reală, nu doar în demo."

experience:
  - en: "25+ years in software, including years in London building systems for CME Group and IHS Markit."
    ro: "Peste 25 de ani în software, inclusiv ani la Londra, unde a construit sisteme pentru CME Group și IHS Markit."
  - en: "In AI since 2013, starting at Stefanini, where he built the company's first machine learning practice for EMEA."
    ro: "Lucrează în AI din 2013, când a început la Stefanini, unde a construit prima practică de machine learning a companiei pentru EMEA."
  - en: "Led a 60-person engineering organisation as VP of Engineering."
    ro: "A condus, ca VP of Engineering, o organizație de inginerie de 60 de oameni."
  - en: "Designed a self-hosted AI platform, with RAG and agents, for a national telecom operator."
    ro: "A proiectat o platformă AI self-hosted, cu RAG și agenți, pentru un operator național de telecom."
  - en: "Worked on speech-to-text and language understanding for medical reports in Romanian."
    ro: "A lucrat la speech-to-text și la înțelegerea limbajului natural pentru rapoarte medicale în română."
  - en: "Presented an AI demo on neuromorphic chips at CES 2024 and Embedded World 2024."
    ro: "A prezentat un demo de AI pe cipuri neuromorfice la CES 2024 și Embedded World 2024."
  - en: "Has delivered for telecom, banking and finance, retail, logistics, insurance, healthcare, manufacturing, energy and semiconductors."
    ro: "A livrat pentru telecom, banking și finanțe, retail, logistică, asigurări, sănătate, producție, energie și semiconductori."
  - en: "Certifications: Google Cloud Machine Learning specialisations and IBM Fundamentals of Scalable Data Science."
    ro: "Certificări: specializările Google Cloud Machine Learning și IBM Fundamentals of Scalable Data Science."

