# The paragraph a search engine or an AI assistant is most likely to quote.
description:
  en: "Mihai Cvasnievschi is an AI/ML architect, AI strategy consultant and mentor based in Bucharest, Romania. He has 25+ years in software and has worked in AI since 2013. He writes AI School, a free AI literacy school for everybody, and mentors founders, CTOs and managers who own AI adoption. He is the founder of AI Labs and the Let's Talk AI community, co-founder of AI Leaders Romania, and the author of Ship It With AI, a free manual on AI coding agents."
  ro: "Mihai Cvasnievschi este arhitect AI/ML, consultant în strategie AI și mentor din București, România. Are peste 25 de ani în software și lucrează în AI din 2013. Scrie AI School, o școală gratuită de AI literacy pentru toată lumea, și este mentor pentru fondatori, CTO și manageri care răspund de adoptarea AI. Este fondatorul AI Labs și al comunității Let's Talk AI, cofondator al AI Leaders Romania și autorul manualului gratuit Ship It With AI, despre agenții AI pentru programare."

