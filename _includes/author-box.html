<aside class="author-box" aria-labelledby="author-box-title">
  <h2 class="author-box-title" id="author-box-title">{% t author.title %}</h2>
  <p class="author-box-bio">{% t author.bio %}</p>
  <p class="author-box-more">{% t author.more %}</p>
  <ul class="author-box-projects">
    {% for proj in site.data.projects %}
    <li><a href="{% include project-url.html project=proj placement='article' %}" target="_blank" rel="noopener">{{ proj.name }}</a>: {{ proj.tagline[site.lang] }}</li>
    {% endfor %}
  </ul>
  <a class="author-box-linkedin" href="https://www.linkedin.com/in/mihaicvasnievschi/" target="_blank" rel="noopener">{% t author.linkedin %} &rarr;</a>
</aside>
