{%- assign me = site.data.person -%}
<a class="skip-link" href="#main">{% t global.skip %}</a>
<nav class="site-nav" aria-label="{% t nav.menu %}">
  <div class="nav-inner">
    <a href="{{ site.baseurl }}/" class="nav-logo">
      <img class="nav-logo-mark" src="{{ site.baseurl_root }}/assets/img/favicon.svg" width="28" height="28" alt="">
      <span class="nav-logo-text">AI School</span>
    </a>

    <button class="nav-toggle" aria-label="{% t nav.menu %}" aria-expanded="false" aria-controls="nav-links">
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
    </button>

    <div class="nav-links" id="nav-links">
      <a href="{{ site.baseurl }}/articles/" class="nav-link{% if page.url contains '/articles/' %} nav-link--active{% endif %}"{% if page.url == '/articles/' %} aria-current="page"{% endif %}>{% t nav.articles %}</a>
      <a href="{{ site.baseurl }}/ai-mentorship/" class="nav-link{% if page.url == '/ai-mentorship/' %} nav-link--active{% endif %}"{% if page.url == '/ai-mentorship/' %} aria-current="page"{% endif %}>{% t nav.mentorship %}</a>
      <a href="{{ site.baseurl }}{{ me.path }}" class="nav-link{% if page.url == me.path %} nav-link--active{% endif %}"{% if page.url == me.path %} aria-current="page"{% endif %}>{% t nav.author %}</a>
      <a href="{{ site.baseurl }}/about/" class="nav-link{% if page.url == '/about/' %} nav-link--active{% endif %}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>{% t nav.about %}</a>
      {% include language-switcher.html %}
    </div>
  </div>
</nav>
