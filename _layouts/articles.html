---
layout: default
---

<div class="container">
  <header class="page-header">
    <h1>{% t articles.title %}</h1>
    <p class="page-lead">{% t articles.intro %}</p>
  </header>

  <div class="articles-grid">
    {% assign posts = site.posts | sort: "series_order" %}
    {% for post in posts %}
      {% include article-card.html post=post %}
    {% endfor %}
  </div>
</div>
