about:
  title: "About"
  description: "AI School is a free AI literacy initiative by Mihai Cvasnievschi. Who writes it, why it is free, and what else he does."
  intro: "AI School is a free AI literacy initiative created by <strong>Mihai Cvasnievschi</strong>, an AI/ML Architect with 25+ years of software development experience and over 10 years building production AI systems."
  bio_more: "His work covers edge AI, enterprise LLM platforms, RAG and MLOps, always with the same test: does it hold up in production, not only in the demo?"
  mission_title: "The Mission"
  mission_gap: "30% of European workers use AI daily. Only 15% have received any training. The EU AI Act now mandates AI literacy for organisations deploying AI systems, with enforcement beginning in 2026."
  mission_free: "AI School exists to close that gap. Everything here is free: the articles, the framework, the methodology. No paywalls, no paid tiers, no sign-up. The value speaks for itself."
  framework_title: "SPARKS-SIX"
  framework_text: "Our articles are grounded in the SPARKS-SIX framework: a six-pillar methodology for working effectively and responsibly with any AI tool. The framework is being released publicly through our article series."
  connect_title: "Connect"
  connect_html: 'Follow the journey on <a href="https://www.linkedin.com/in/mihaicvasnievschi/" target="_blank" rel="noopener">LinkedIn</a>, where the original article series is published.'

